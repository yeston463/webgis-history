<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>min-repro-3-http</title>
<script src="vendor/maplibre/maplibre-gl.js"></script>
<style>html,body,#map{width:100%;height:100%;margin:0;padding:0}</style>
</head>
<body>
<div id="map"></div>
<script>
/* 与 test-results/min-repro-3.html 同源，仅改相对路径；测试 mode=A|C */
const tk = '6a7dc42ae90a528588b9f69989ae4e66';
const TDT_SCHEME = 'tdtQ';
const TDT_MAX_CONCURRENT = 6;
let tdtActiveN = 0;
const tdtQueue = [];
function abortErr() { return new DOMException('Aborted', 'AbortError'); }
function Signal_remove(signal, fn) { if (signal && typeof signal.removeEventListener === 'function') signal.removeEventListener('abort', fn); }
function tdtEnqueue(task, signal) {
  return new Promise((resolve, reject) => {
    if (signal && signal.aborted) return reject(abortErr());
    const job = { task, done: false };
    job.cancel = () => { if (job.done) return; const i = tdtQueue.indexOf(job); if (i >= 0) tdtQueue.splice(i, 1); job.done = true; job.cleanup(); try { (window.__cancelStacks = window.__cancelStacks || []).push(1); } catch (e) {} reject(abortErr()); };
    job.cleanup = () => { if (signal) Signal_remove(signal, job.cancel); };
    job.settle = (err, value) => { if (job.done) return; job.done = true; tdtActiveN = Math.max(0, tdtActiveN - 1); job.cleanup(); err ? reject(err) : resolve(value); pumpTdt(); };
    if (signal) signal.addEventListener('abort', job.cancel, { once: true });
    tdtQueue.push(job);
    pumpTdt();
  });
}
function pumpTdt() {
  while (tdtActiveN < TDT_MAX_CONCURRENT && tdtQueue.length) {
    const job = tdtQueue.shift();
    tdtActiveN += 1;
    Promise.resolve().then(() => job.task()).then((v) => job.settle(null, v), (e) => job.settle(e));
  }
}
async function tdtLoadProtocol(params, abortController) {
  const real = decodeURIComponent(String(params.url || '').slice((TDT_SCHEME + '://').length));
  const signal = abortController ? abortController.signal : undefined;
  const t0f = performance.now();
  try {
    if (signal && signal.aborted) throw abortErr();
    return { data: await tdtEnqueue(async () => {
      const res = await fetch(real, { signal, credentials: 'omit' });
      if (!res.ok) { const err = new Error('tianditu ' + res.status); err.status = res.status; throw err; }
      return res.arrayBuffer();
    }, signal) };
  } catch (err) {
    try { console.warn('[min3]', Math.round(performance.now() - t0f) + 'ms fly', (err && err.name) + ' ab=' + !!signal.aborted, (real.match(/TILEMATRIX=\d+/) || [''])[0]); } catch (e) {}
    throw err;
  }
}
maplibregl.addProtocol('tdtQ', tdtLoadProtocol);

function tdttiles(layer) {
  const subs = ['t0', 't1', 't2', 't3', 't4', 't5', 't6', 't7'];
  return subs.map((s) => 'tdtQ://' + encodeURIComponent('https://' + s + '.tianditu.gov.cn/' + layer + '/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=' + layer.split('_')[0] + '&STYLE=default&TILEMATRIXSET=w&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&FORMAT=tiles&tk=' + tk).replace(/%7B/g, '{').replace(/%7D/g, '}'));
}
const mode = (new URLSearchParams(location.search).get('mode') || 'A');
window.__mode = mode;
const map = new maplibregl.Map({
  container: 'map',
  style: { version: 8, sources: {}, layers: [{ id: 'tdt-bg', type: 'background', paint: { 'background-color': '#f3ede2' } }] },
  center: [104.5, 35.5],
  zoom: 3.1,
  minZoom: 2.2,
  maxZoom: 17,
  attributionControl: false,
  dragRotate: false,
  pitchWithRotate: false,
  antialias: true,
});
window.__minMap = map;
map.on('load', async () => {
  map.addSource('tdt-vec', { type: 'raster', tiles: tdttiles('vec_w'), tileSize: 256, minzoom: 1, maxzoom: 18 });
  map.addSource('tdt-cva', { type: 'raster', tiles: tdttiles('cva_w'), tileSize: 256, minzoom: 1, maxzoom: 18 });
  map.addLayer({ id: 'tdt-vec', type: 'raster', source: 'tdt-vec' });
  map.addLayer({ id: 'tdt-cva', type: 'raster', source: 'tdt-cva' });
  if (mode >= 'C') {
    await new Promise((r) => setTimeout(r, 500));
    map.flyTo({ center: [113.98, 22.52], zoom: 10.6, duration: 2600 });
  }
  window.__TEST_READY = true;
});
</script>
</body></html>
